[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-always-on-top"
version = "0.1.0"
description = "Always On Top for Omarchy: keep a window above the others, with a highlight border in your theme's accent colour."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Andre Bruno" }]
keywords = ["omarchy", "powertoys", "always-on-top", "hyprland", "wayland", "pin"]
classifiers = [
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: Window Managers",
]
dependencies = []

[project.scripts]
omarchy-always-on-top = "oaot.cli:main"

[project.urls]
Homepage = "https://github.com/andrebbruno/omarchy-always-on-top"

[tool.setuptools.packages.find]
include = ["oaot*"]
